[project]
name = "opportunity-scanner"
version = "0.1.0"
description = "Where could AI save time in your organisation? An exploratory scan built on task-level AI exposure."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
