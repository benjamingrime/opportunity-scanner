[project]
name = "opportunity-scanner"
version = "0.1.0"
description = "Where could AI save time in your organisation? An exploratory scan built on task-level AI exposure."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain-aws>=1.9",
    "langchain-core>=1.6",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "langgraph-checkpoint-aws>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "mcp>=2.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "botocore[crt]>=1.43.118",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pytest>=8",
    "scipy>=1.18.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
