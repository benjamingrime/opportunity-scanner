name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - name: data build is reproducible
        run: |
          uv run python pipeline/build_data.py
          git diff --exit-code scanner/data
