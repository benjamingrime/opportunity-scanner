# CodeBuild, run by the deploy pipeline on each push to main (infra/bootstrap/pipeline.tf).
version: 0.2

env:
  variables:
    TF_VERSION: "1.17.0"
    UV_VERSION: "0.10.9"
    TF_IN_AUTOMATION: "1"

phases:
  install:
    commands:
      - pip3 install --quiet "uv==${UV_VERSION}"
      - curl -fsSLo /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_arm64.zip"
      - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" | grep linux_arm64.zip | awk '{print $1"  /tmp/tf.zip"}' | sha256sum -c -
      - unzip -oq /tmp/tf.zip -d /usr/local/bin
  pre_build:
    commands:
      - uv sync --locked
      - uv run pytest -q # LLM replies are replayed: no keys, no cost
      - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - IMAGE="${REGISTRY}/opportunity-scanner:${COMMIT}"
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${REGISTRY}"
  build:
    commands:
      # tags are immutable, so a re-run of the same commit reuses its image
      - |
        if aws ecr describe-images --repository-name opportunity-scanner --image-ids imageTag="${COMMIT}" >/dev/null 2>&1; then
          echo "image ${COMMIT} already pushed"
        else
          docker build -t "${IMAGE}" . && docker push "${IMAGE}"
        fi
      - cd infra
      - terraform init -input=false -backend-config="bucket=opportunity-scanner-tfstate-${ACCOUNT}"
      - terraform apply -input=false -auto-approve -var "image_tag=${COMMIT}"
  post_build:
    commands:
      - URL=$(terraform output -raw url)
      - curl -fsS "${URL}api/meta" >/dev/null
      - >-
        curl -fsS -X POST "${URL}mcp" -H "Accept: application/json, text/event-stream"
        -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2025-06-18"
        -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q grep_titles
      - echo "deployed ${COMMIT} to ${URL}"
